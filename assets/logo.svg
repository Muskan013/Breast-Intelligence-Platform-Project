<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background shapes -->
  <rect x="15" y="15" width="70" height="90" rx="10" fill="#0d99ff" />
  <circle cx="170" cy="60" r="45" fill="#8a5cf5" />
  <rect x="215" y="15" width="70" height="90" rx="10" fill="#0e9b8f" />
  
  <!-- Connecting design elements -->
  <line x1="85" y1="60" x2="125" y2="60" stroke="#5b84ff" stroke-width="5" />
  <line x1="215" y1="60" x2="175" y2="60" stroke="#5b84ff" stroke-width="5" />
  
  <!-- Breast cancer awareness ribbon -->
  <path d="M150 24 C 155 30, 160 40, 150 48 C 140 40, 145 30, 150 24" fill="#ff3e96" />
  
  <!-- Text BreastCare -->
  <text x="150" y="90" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">BreastCare Predict</text>
  
  <!-- Neural network nodes -->
  <circle cx="50" cy="40" r="5" fill="#ffffff" />
  <circle cx="50" cy="60" r="5" fill="#ffffff" />
  <circle cx="50" cy="80" r="5" fill="#ffffff" />
  
  <circle cx="170" cy="35" r="5" fill="#ffffff" />
  <circle cx="170" cy="60" r="5" fill="#ffffff" />
  <circle cx="170" cy="85" r="5" fill="#ffffff" />
  
  <circle cx="250" cy="40" r="5" fill="#ffffff" />
  <circle cx="250" cy="60" r="5" fill="#ffffff" />
  <circle cx="250" cy="80" r="5" fill="#ffffff" />
  
  <!-- Connection lines to represent a neural network -->
  <line x1="50" y1="40" x2="170" y2="35" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="40" x2="170" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="40" x2="170" y2="85" stroke="#ffffff" stroke-width="1.5" />
  
  <line x1="50" y1="60" x2="170" y2="35" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="60" x2="170" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="60" x2="170" y2="85" stroke="#ffffff" stroke-width="1.5" />
  
  <line x1="50" y1="80" x2="170" y2="35" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="80" x2="170" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="50" y1="80" x2="170" y2="85" stroke="#ffffff" stroke-width="1.5" />
  
  <line x1="170" y1="35" x2="250" y2="40" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="35" x2="250" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="35" x2="250" y2="80" stroke="#ffffff" stroke-width="1.5" />
  
  <line x1="170" y1="60" x2="250" y2="40" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="60" x2="250" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="60" x2="250" y2="80" stroke="#ffffff" stroke-width="1.5" />
  
  <line x1="170" y1="85" x2="250" y2="40" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="85" x2="250" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <line x1="170" y1="85" x2="250" y2="80" stroke="#ffffff" stroke-width="1.5" />
</svg>